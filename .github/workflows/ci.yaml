name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    env:
      # Built from source until tomatool/tomato#148 (cookie + Host header
      # steps) is released; then switch to the tomatool/tomato@v2 action.
      TOMATO_REF: 9093d4490502dafdbd621fd4210183cead1176b9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install tomato
        run: |
          git init --quiet "$RUNNER_TEMP/tomato"
          git -C "$RUNNER_TEMP/tomato" fetch --quiet --depth 1 https://github.com/tomatool/tomato.git "$TOMATO_REF"
          git -C "$RUNNER_TEMP/tomato" checkout --quiet FETCH_HEAD
          (cd "$RUNNER_TEMP/tomato" && go build -o "$RUNNER_TEMP/bin/tomato" .)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make e2e
